[workspace]
resolver = "3"
members = ["api"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

# Shared dependency versions for every Rust crate in the monorepo. Members opt in
# with `dep.workspace = true` so upgrades happen in exactly one place.
[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
# Only the backend metadata, never the `postgres` feature: that one links
# libpq. Wire protocol and io are diesel-async's job (tokio-postgres), which
# keeps the build pure Rust and the Bazel toolchain hermetic.
diesel = { version = "2.3.12", features = ["chrono", "postgres_backend", "uuid"] }
diesel-async = { version = "0.9.2", features = ["bb8", "migrations", "postgres"] }
diesel_migrations = "2.3.2"
dotenvy = "0.15.7"
# `rust_crypto`, never `aws_lc_rs`: that backend needs cmake, which is the same
# reason reqwest is pinned to 0.12. Pure Rust keeps the Bazel action hermetic.
jsonwebtoken = { version = "11.0.0", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
http-body-util = "0.1.5"
mockall = "0.13.1"
rand = "0.10.2"
# rustls over ring, with the Mozilla root store compiled in by webpki-roots.
# aws-lc-rs (reqwest 0.13's only rustls option) needs cmake, and a platform
# verifier needs the host cert store; neither survives a hermetic Bazel action.
reqwest = { version = "0.12.28", default-features = false, features = [
    "charset",
    "http2",
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# Constant-time comparison, with the optimisation barriers a hand-rolled fold
# cannot promise.
subtle = "2.6.1"
thiserror = "2.0.20"
# Cookie attribute durations only. The `cookie` crate's builder speaks
# time::Duration and axum-extra re-exports neither.
time = { version = "0.3.55", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = [
    "catch-panic",
    "compression-full",
    "cors",
    "limit",
    "request-id",
    "sensitive-headers",
    "timeout",
    "trace",
    "util",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["serde"] }

[profile.release]
# Slower builds, meaningfully faster and smaller binaries for deployed services.
codegen-units = 1
lto = "thin"
strip = "debuginfo"
